name: Release checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run release:check
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        players: [2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck:browser
      - run: PLAYWRIGHT_BROWSERS_PATH=./work/playwright-browsers npx playwright install --with-deps chromium
      - run: npm run test:browser -- --grep '^${{ matrix.players }}-player'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.players }}-players
          path: |
            work/05-playwright-results.json
            work/browser-artifacts/
          retention-days: 7
